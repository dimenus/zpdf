# Publishes the Zpdf NuGet package when a tag v<version> is pushed. The version is the one in
# dotnet/Zpdf/Zpdf.csproj, and the tag must name it. nuget.org trusted publishing: NuGet/login trades
# this run's GitHub OIDC token for a one-hour API key, so no key is stored anywhere. The policy on
# nuget.org (user dimenus) names this repository and this file, release.yml.
#
# Run by hand (workflow_dispatch), it does everything but the login and the push: a dry run.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: The tag names the csproj's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' dotnet/Zpdf/Zpdf.csproj)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME, and Zpdf.csproj says $version" >&2
            exit 1
          fi
      - name: zig build test
        run: zig build test --summary failures
      - name: zig build dotnet-test
        run: zig build dotnet-test --summary failures
      - name: zig build dotnet-pack
        run: zig build dotnet-pack --summary failures
      - name: The package holds the library and libzpdf for every RID
        run: |
          set -euo pipefail
          packages=(zig-out/nuget/*.nupkg)
          if [ ${#packages[@]} -ne 1 ]; then echo "expected one package, found: ${packages[*]}" >&2; exit 1; fi
          listing=$(unzip -Z1 "${packages[0]}")
          for file in lib/net10.0/Zpdf.dll LICENSE THIRD-PARTY-NOTICES.md runtimes/linux-x64/native/libzpdf.so runtimes/linux-arm64/native/libzpdf.so runtimes/osx-arm64/native/libzpdf.dylib runtimes/win-x64/native/zpdf.dll; do
            grep -qx "$file" <<<"$listing" || { echo "${packages[0]} has no $file" >&2; exit 1; }
          done
          echo "${packages[0]}:"; echo "$listing"
      - uses: NuGet/login@v1
        if: startsWith(github.ref, 'refs/tags/v')
        id: login
        with:
          user: dimenus
      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push zig-out/nuget/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
